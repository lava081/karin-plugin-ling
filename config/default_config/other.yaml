  BlackGroup:
    - "636023444"
  cd: 30

# 上下班
NoWork:
  - "636023444"

# 进群通知内容
welcome:
  default:
    # 0: 全局关闭通知 1: 开启
    mode: 1
    text: "\n欢迎加入本群୯(⁠*⁠´⁠ω⁠｀⁠*⁠)୬"
  # 进群人为机器人自身
  self:
    # 0: 关闭通知 1: 继承default的配置 2: 使用本独立配置
    mode: 1
    text: "\n欢迎加入本群୯(⁠*⁠´⁠ω⁠｀⁠*⁠)୬"

# 进群验证
Test:
  - "114514"
# 群/好友请求处理
DealRequest:
  # 处理拉群邀请
  InvitedJoinGroup:
    # 自动接受邀请
    accept: false
    # 给所有主人发送通知
    notify: true
  # 处理好友请求
  Friend:
    accept: false
    notify: true
  # 处理入群请求
  Group:
    # 支持指定若干群启用，指定后为白名单模式，只有在列表中的群才会被处理
    - "12345":
        accept: false
        notify: true
    # 支持全局设置，不指定群号则为全局设置
    # accept: false
    # notify: true
